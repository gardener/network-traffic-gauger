version: "2"

run:
  timeout: 2m

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gardener/network-traffic-gauger

linters:
  enable:
    - gocritic
    - godot
    - misspell
    - nolintlint
    - predeclared
    - revive
    - unused
    - staticcheck
    - unconvert
    - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # dot imports in test files and utilities
      - path: ".*test.*.go$"
        text: "should not use dot imports"
        linters:
          - staticcheck
          - revive
    presets:
      - std-error-handling
